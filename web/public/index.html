<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAB III - Gerenciador de Usuários</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🧪 LAB III — Sistema de Usuários</h1>
      <p>Consumindo a API de gerenciamento de usuários</p>
    </header>

    <section class="section">
      <h2>📊 Exercicios</h2>
      <div class="buttons-grid">
        <button onclick="carregarTotal()" class="btn btn-primary">
          <span>📈</span> Total de Usuários
        </button>
        <button onclick="carregarMaiores()" class="btn btn-primary">
          <span>🔞</span> Maiores de 18
        </button>
        <button onclick="buscarPorCidade()" class="btn btn-primary">
          <span>🏙️</span> Buscar por Cidade
        </button>
        <button onclick="carregarMedia()" class="btn btn-primary">
          <span>📊</span> Média de Idade
        </button>
        <button onclick="carregarMaisVelho()" class="btn btn-primary">
          <span>👴</span> Usuário Mais Velho
        </button>
        <button onclick="carregarAgrupamento()" class="btn btn-primary">
          <span>🗺️</span> Agrupamento por Cidade
        </button>
        <button onclick="carregarOrdenados()" class="btn btn-primary">
          <span>📋</span> Ordenados por Idade
        </button>
        <button onclick="carregarEstatisticas()" class="btn btn-primary">
          <span>📈</span> Estatísticas Completas
        </button>
        <button onclick="listarTodos()" class="btn btn-secondary">
          <span>👥</span> Listar Todos
        </button>
      </div>
    </section>

    <section class="section">
      <h2>➕ Adicionar Novo Usuário</h2>
      <form onsubmit="adicionarUsuario(event)" class="form">
        <div class="form-group">
          <input type="text" id="nome" placeholder="Nome" required>
        </div>
        <div class="form-group">
          <input type="number" id="idade" placeholder="Idade" required>
        </div>
        <div class="form-group">
          <input type="text" id="cidade" placeholder="Cidade" required>
        </div>
        <button type="submit" class="btn btn-success">Adicionar Usuário</button>
      </form>
    </section>

    <section class="section">
      <h2>📑 Resultado</h2>
      <textarea id="resultado" readonly class="resultado"></textarea>
    </section>

    <section class="section">
      <h2>🔍 Buscar por ID</h2>
      <div class="search-form">
        <input type="number" id="buscaId" placeholder="ID do usuário">
        <button onclick="buscarPorId()" class="btn btn-info">Buscar</button>
      </div>
    </section>

    <section class="section">
      <h2>🔍 Buscar por Cidade</h2>
      <div class="search-form">
        <input type="text" id="buscaCidade" placeholder="Nome da cidade (ex: Lages)">
        <button onclick="buscarPorCidade()" class="btn btn-info">Buscar por Cidade</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
